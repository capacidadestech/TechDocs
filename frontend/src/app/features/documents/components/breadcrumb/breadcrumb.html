<div class="folder-header">
  @if (ancestors().length) {
    <nav class="trail" aria-label="Ruta de carpetas">
      @for (a of ancestors(); track a.id ?? 'root') {
        <button class="trail__link" type="button" (click)="select(a.id)">{{ a.name }}</button>
        <span class="trail__sep" aria-hidden="true">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </span>
      }
    </nav>
  }
  <h1 class="folder-header__title display">{{ title() }}</h1>
</div>
