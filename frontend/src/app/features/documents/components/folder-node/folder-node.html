<div class="node">
  <button
    class="node__row"
    type="button"
    [class.is-active]="isActive()"
    [style.padding-left.rem]="0.5 + depth() * 0.75"
    (click)="open()"
  >
    <!-- Chevron de expandir/colapsar (solo si tiene subcarpetas) -->
    @if (hasChildren()) {
      <span
        class="node__chevron"
        [class.is-open]="expanded()"
        role="button"
        tabindex="0"
        aria-label="Expandir/colapsar"
        (click)="toggle($event)"
        (keydown.enter)="toggle($event)"
        (keydown.space)="toggle($event)"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </span>
    } @else {
      <span class="node__chevron node__chevron--placeholder" aria-hidden="true"></span>
    }

    <svg
      class="node__icon"
      [style.color]="folderColor()"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="currentColor"
      stroke="none"
      aria-hidden="true"
    >
      <path
        d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
      />
    </svg>

    <span class="node__name">{{ folder().name }}</span>

    @if (docCount() > 0) {
      <span class="count">{{ docCount() }}</span>
    }

    <span class="node__actions">
      <span
        class="node__action"
        role="button"
        tabindex="0"
        title="Nueva subcarpeta"
        aria-label="Nueva subcarpeta"
        (click)="startAdd($event)"
        (keydown.enter)="startAdd($event)"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14M12 5v14" />
        </svg>
      </span>
      <span
        class="node__action"
        role="button"
        tabindex="0"
        title="Eliminar carpeta"
        aria-label="Eliminar carpeta"
        (click)="remove($event)"
        (keydown.enter)="remove($event)"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"
          />
        </svg>
      </span>
    </span>
  </button>

  @if (expanded()) {
    <!-- Input inline para crear subcarpeta -->
    @if (adding()) {
      <input
        class="input node__new"
        [style.margin-left.rem]="0.5 + (depth() + 1) * 0.75"
        type="text"
        placeholder="Nombre de la carpeta"
        [(ngModel)]="newName"
        (keydown.enter)="confirmAdd()"
        (keydown.escape)="cancelAdd()"
        (blur)="confirmAdd()"
      />
    }

    @for (child of children(); track child.id) {
      <app-folder-node [folder]="child" [depth]="depth() + 1" />
    }
  }
</div>
