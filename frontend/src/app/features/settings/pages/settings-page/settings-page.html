<div class="settings">
  <section class="section">
    <p class="eyebrow">Apariencia</p>
    <p class="muted section__hint">Elige el tema de la app — pasa el mouse para previsualizar.</p>

    <div class="theme-grid" (mouseleave)="theme.cancelPreview()">
      @for (t of theme.themes; track t.id) {
        <button class="theme-card" type="button" [appThemeSwatch]="t.id" (click)="goHome()">
          <span class="theme-card__preview">
            <span [style.background]="t.tokens['--color-background']"></span>
            <span [style.background]="t.tokens['--color-surface']"></span>
            <span [style.background]="t.tokens['--color-primary']"></span>
            <span [style.background]="t.tokens['--color-accent']"></span>
          </span>
          <span class="theme-card__foot">
            <span class="theme-card__name">{{ t.name }}</span>
            <span class="theme-card__check" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
          </span>
        </button>
      }
    </div>
  </section>
</div>
