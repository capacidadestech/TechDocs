<div class="login">
  <!-- Panel decorativo (oculto en pantallas pequeñas) -->
  <aside class="panel" aria-hidden="true">
    <div class="ripple">
      <span class="ripple__ring" style="--i: 0"></span>
      <span class="ripple__ring" style="--i: 1"></span>
      <span class="ripple__ring" style="--i: 2"></span>
      <span class="ripple__ring" style="--i: 3"></span>
      <span class="ripple__ring" style="--i: 4"></span>
      <span class="ripple__ring" style="--i: 5"></span>
    </div>

    <div class="orbit">
      <div class="orbit__center">
        <p class="orbit__brand">TechDocs</p>
      </div>

      <!-- Anillo interior -->
      <div class="ring ring--inner ring--rev" style="--dur: 18s">
        <div class="spoke" style="--a: 0deg">
          <span class="badge" title="TypeScript"
            ><img class="ic" src="/logos/typescript.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 120deg">
          <span class="badge" title="JavaScript"
            ><img class="ic" src="/logos/javascript.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 240deg">
          <span class="badge" title="Git"
            ><img class="ic" src="/logos/git.svg" alt="" width="28" height="28"
          /></span>
        </div>
      </div>

      <!-- Anillo medio -->
      <div class="ring ring--mid" style="--dur: 26s">
        <div class="spoke" style="--a: 0deg">
          <span class="badge" title="Angular"
            ><img class="ic" src="/logos/angular.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 72deg">
          <span class="badge" title="NestJS"
            ><img class="ic" src="/logos/nestjs.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 144deg">
          <span class="badge" title="Node.js"
            ><img class="ic" src="/logos/nodejs.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 216deg">
          <span class="badge" title="React"
            ><img class="ic" src="/logos/react.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 288deg">
          <span class="badge" title="HTML5"
            ><img class="ic" src="/logos/html5.svg" alt="" width="28" height="28"
          /></span>
        </div>
      </div>

      <!-- Anillo exterior -->
      <div class="ring ring--outer ring--rev" style="--dur: 34s">
        <div class="spoke" style="--a: 0deg">
          <span class="badge" title="PostgreSQL"
            ><img class="ic" src="/logos/postgresql.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 60deg">
          <span class="badge" title="Docker"
            ><img class="ic" src="/logos/docker.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 120deg">
          <span class="badge" title="RabbitMQ"
            ><img class="ic" src="/logos/rabbitmq.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 180deg">
          <span class="badge" title="CSS3"
            ><img class="ic" src="/logos/css3.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 240deg">
          <span class="badge" title="Cypress"
            ><img class="ic" src="/logos/cypress.svg" alt="" width="28" height="28"
          /></span>
        </div>
        <div class="spoke" style="--a: 300deg">
          <span class="badge" title="Grafana"
            ><img class="ic" src="/logos/grafana.svg" alt="" width="28" height="28"
          /></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Formulario -->
  <section class="form-side">
    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="form__title">Bienvenido de nuevo</h1>
      <p class="form__sub">Inicia sesión en tu cuenta</p>

      <div class="field">
        <label class="field__label" for="email">Correo <span class="req">*</span></label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@empresa.com"
          [class.input--error]="showError('email')"
        />
        @if (showError('email')) {
          <p class="error">{{ errorFor('email') }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Contraseña <span class="req">*</span></label>
        <div class="password" [class.input--error]="showError('password')">
          <input
            id="password"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="password__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (passwordVisible()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                />
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                <path
                  d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                />
                <path d="m2 2 20 20" />
              </svg>
            }
          </button>
        </div>
        @if (showError('password')) {
          <p class="error">{{ errorFor('password') }}</p>
        }
      </div>

      <button type="submit" class="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="submit__spinner" aria-hidden="true"></span> Entrando…
        } @else {
          Entrar &rarr;
        }
      </button>

      <button type="button" class="forgot" (click)="forgotPassword()" [disabled]="loading()">
        ¿Olvidaste tu contraseña?
      </button>
    </form>
  </section>

  <!-- Loading de entrada (demo): overlay con marca + spinner -->
  @if (loading()) {
    <div class="auth-loader" role="status" aria-live="polite">
      <span class="auth-loader__spinner" aria-hidden="true"></span>
      <p class="auth-loader__brand">TechDocs</p>
      <p class="auth-loader__text">Entrando…</p>
    </div>
  }
</div>
