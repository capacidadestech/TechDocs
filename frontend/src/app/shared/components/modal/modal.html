<div class="modal-backdrop" (click)="close.emit()"></div>

<div class="modal card" role="dialog" aria-modal="true" [attr.aria-label]="heading()">
  <header class="modal__head">
    <h2 class="modal__title display">{{ heading() }}</h2>
    <button class="btn btn--icon" type="button" (click)="close.emit()" aria-label="Cerrar">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </header>

  <div class="modal__body">
    <ng-content />
  </div>
</div>
