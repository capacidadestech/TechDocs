<div class="paginator">
  <label class="paginator__size">
    <span class="muted">Filas por página</span>
    <select
      class="input pill paginator__select"
      [value]="pageSize()"
      (change)="changeSize($any($event.target).value)"
    >
      @for (opt of pageSizeOptions(); track opt) {
        <option [value]="opt">{{ opt }}</option>
      }
    </select>
  </label>

  <div class="paginator__right">
    <span class="paginator__info muted">{{ from() }}–{{ to() }} de {{ total() }}</span>

    <nav class="pager" aria-label="Paginación">
      <button
        class="pager__btn pager__btn--nav"
        type="button"
        (click)="goTo(page() - 1)"
        [disabled]="page() <= 1"
        aria-label="Página anterior"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      @for (p of pages(); track $index) {
        @if (p === '…') {
          <span class="pager__gap" aria-hidden="true">…</span>
        } @else {
          <button
            class="pager__btn"
            type="button"
            [class.is-active]="p === page()"
            [attr.aria-current]="p === page() ? 'page' : null"
            (click)="goTo(p)"
          >
            {{ p }}
          </button>
        }
      }

      <button
        class="pager__btn pager__btn--nav"
        type="button"
        (click)="goTo(page() + 1)"
        [disabled]="page() >= totalPages()"
        aria-label="Página siguiente"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </nav>
  </div>
</div>
