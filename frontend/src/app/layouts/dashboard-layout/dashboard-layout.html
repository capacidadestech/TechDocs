<div
  class="layout"
  [class.layout--open]="sidebarOpen()"
  [class.layout--collapsed]="sidebarCollapsed()"
>
  <app-sidebar />
  <div class="backdrop" (click)="closeSidebar()"></div>

  <!-- Pestaña para colapsar/mostrar el sidebar (escritorio) -->
  <button
    class="sidebar-toggle"
    type="button"
    (click)="toggleCollapsed()"
    [attr.aria-label]="sidebarCollapsed() ? 'Mostrar menú' : 'Ocultar menú'"
    [attr.aria-expanded]="!sidebarCollapsed()"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @if (sidebarCollapsed()) {
        <path d="m9 18 6-6-6-6" />
      } @else {
        <path d="m15 18-6-6 6-6" />
      }
    </svg>
  </button>

  <div class="content-col">
    <!-- Top bar (solo móvil) -->
    <header class="topbar frosted">
      <button class="btn btn--icon" type="button" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>
      <span class="topbar__brand display">TechDocs</span>
      <app-user-menu />
    </header>

    <main class="main">
      <div class="container">
        <app-header />
        <div class="content">
          <router-outlet />
        </div>
      </div>
    </main>
  </div>
</div>
